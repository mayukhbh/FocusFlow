<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Focus Mode</h1>
      <p class="subtitle">Block distractions on YouTube </p>
    </div>
    
    <div class="toggle-section">
      <div class="toggle-wrapper">
        <label class="switch">
          <input type="checkbox" id="researchModeToggle">
          <span class="slider round"></span>
        </label>
        <div class="toggle-info">
          <span class="toggle-label" id="toggleLabel">Research Mode OFF</span>
          <span class="toggle-description" id="toggleDescription">Distracting elements are visible</span>
        </div>
      </div>
    </div>
    
    <div class="status-section">
      <div class="current-site" id="currentSite">
        <span class="site-icon">🌐</span>
        <span id="siteStatus">Unknown site</span>
      </div>
    </div>
    
    <div class="footer">
      <small>Stay focused, stay productive</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
