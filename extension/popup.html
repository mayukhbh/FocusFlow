<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="pop" id="pop" data-on="false">
    <header class="pop-head">
      <span class="pop-name">Focus Mode</span>
      <a class="pop-settings" href="options.html" target="_blank" id="settingsLink">Settings</a>
    </header>

    <button type="button" class="switch" id="switch" role="switch" aria-checked="false" aria-describedby="stateText">
      <span class="switch-track" aria-hidden="true">
        <span class="switch-thumb"></span>
      </span>
      <span class="sr" id="switchLabel">Focus Mode</span>
    </button>

    <p class="pop-state" id="stateTitle">Focus is off</p>
    <p class="pop-desc" id="stateText">YouTube looks the way it normally does.</p>

    <dl class="pop-facts">
      <div>
        <dt>Focused today</dt>
        <dd id="focusedToday">None yet</dd>
      </div>
      <div>
        <dt>This tab</dt>
        <dd id="tabStatus">Checking</dd>
      </div>
    </dl>
  </main>
  <script src="popup.js"></script>
</body>
</html>
